<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PredictiveBES · Iniciar Sesión</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .logo-container { text-align: center; margin-bottom: 32px; }
        .logo-container h2 { color: #0f172a; font-size: 1.5rem; font-weight: 800; }
        .logo-container h2 span { color: #3b82f6; }
        .logo-container p { color: #64748b; font-size: 0.85rem; margin-top: 8px; font-weight: 500; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; color: #475569; font-weight: 600; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: #3b82f6; }
        .btn-login { background: #3b82f6; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%; transition: background 0.2s; margin-top: 10px; }
        .btn-login:hover { background: #2563eb; }
        .error-msg { color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 16px; display: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-container">
            <h2>🔬 <span>Predictive</span>BES</h2>
            <p>Software Predictivo para Diagnóstico de Fallas</p>
        </div>
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="email" placeholder="usuario@empresa.com">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button class="btn-login" id="btnLogin">Ingresar al Sistema</button>
        <div class="error-msg" id="errorMsg">Credenciales inválidas. Intente nuevamente.</div>
    </div>
    <script>
        const supabase = window.supabase.createClient('https://qkpkmgmidffdqaqwfiho.supabase.co', 'sb_publishable_IfsgsenpGA1BM5_aMkMrfQ_BtoQN8Ke');
        
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) window.location.href = 'dashboard.html';
        }
        checkSession();

        document.getElementById('btnLogin').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('btnLogin');
            
            btn.textContent = 'Verificando...';
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = error.message;
                btn.textContent = 'Ingresar al Sistema';
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
